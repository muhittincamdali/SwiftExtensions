name: Extension proposal
description: Propose an extension for SwiftExtensions
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The package only takes extensions that the standard library, Foundation and SwifterSwift do not provide, that are correct under Swift 6 strict concurrency, and that come with tests for their edge cases (see CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you write today, and why does it trap, grow without a limit or not compile in the Swift 6 language mode?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed extension
      description: The API you would like, with a short code sample.
      render: swift
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: The closest API in the standard library, Foundation, SwifterSwift or another package, and why it is not enough.
    validations:
      required: true
