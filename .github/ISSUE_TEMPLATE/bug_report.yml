name: Bug report
description: An extension in SwiftExtensions does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Input that makes an extension crash, hang or use memory without bound is a security issue: report it privately (see SECURITY.md), not here.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: The call, the input values, what you expected and what you got.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Code that shows it
      description: A few lines that call the extension with the values that show the problem.
      render: swift
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SwiftExtensions version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: "iOS 27.0 simulator"
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: "27.1"
    validations:
      required: true
